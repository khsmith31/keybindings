<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Keybind Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Gamer Keybind Tracker</h1>
        </header>

        <!-- Search Bar Section -->
        <section class="search-section">
            <input type="text" id="searchBar" placeholder="Search by action or category (e.g., jump, movement)...">
        </section>

        <!-- Game Profile Management -->
        <section class="game-management">
            <div class="add-game-box">
                <input type="text" id="newGameInput" placeholder="Enter new game name...">
                <button id="addGameBtn" class="btn btn-add">Add Game</button>
            </div>
            <button id="deleteGameBtn" class="btn btn-delete">Delete Active Game</button>
        </section>

        <!-- Dynamic Game Tabs -->
        <nav id="gameTabs" class="tabs-container">
            <!-- Tabs injected by JS -->
        </nav>

        <!-- NEW: Add Keybind Inputs Row -->
        <section class="binding-management">
            <input type="text" id="newActionInput" placeholder="Action (e.g. Crouch)">
            <input type="text" id="newKeyInput" placeholder="Keybind (e.g. Shift)">
            <input type="text" id="newCategoryInput" placeholder="Category (e.g. Movement)">
            <button id="addBindingBtn" class="btn btn-add">Add Keybind</button>
        </section>

        <!-- Keybinds Table Visual -->
        <main class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Action</th>
                        <th>Keybind</th>
                        <th>Category</th>
                        <th style="width: 80px; text-align: center;">Manage</th>
                    </tr>
                </thead>
                <tbody id="bindingsBody">
                    <!-- Keybind rows injected by JS -->
                </tbody>
            </table>
        </main>

        <!-- NEW: Simplified Bottom Watermark/Footer -->
        <footer class="bottom-watermark">
            <span>🎮 Created by Ken Smith KSG</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
